<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cardpipe — Hyper Battle Card Screener</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header>
    <h1>cardpipe</h1>
    <p class="subtitle">Hyper Battle First Stage card screener</p>
  </header>

  <section id="dropzone" class="dropzone">
    <div class="dz-inner">
      <div class="dz-icon">📷</div>
      <p>Drop a card scan here or click to browse</p>
      <p class="dz-hint">JPEG, PNG, or WebP — front or back</p>
    </div>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
  </section>

  <section id="results" hidden></section>

  <section id="stats" hidden>
    <div class="stat"><span id="statTotal">0</span><label>scanned</label></div>
    <div class="stat"><span id="statMatch">0</span><label>matched</label></div>
    <div class="stat"><span id="statReject">0</span><label>rejected</label></div>
    <div class="stat"><span id="statTime">0ms</span><label>avg time</label></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
